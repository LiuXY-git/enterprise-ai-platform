# Standalone opt-in stack. Does not replace the existing knowledge-hub deployment.
name: enterprise-console
services:
  api:
    image: enterprise-ai-platform-console-api:day3
    build:
      context: .
      dockerfile: docker/Dockerfile.console-api
    command: ["uvicorn", "backend.app.console.application:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      WEB_CONSOLE_DATA_DIR: /app/console-data
      WEB_CONSOLE_QUEUE_LIMIT: "32"
      WEB_CONSOLE_TIMEOUT_SECONDS: "10"
      WEB_CONSOLE_AGENT_TIMEOUT_SECONDS: "60"
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - ./data/web-console/api:/app/data
      - ./data/web-console/chroma-cache:/home/app/.cache/chroma
      - ./data/web-console/queue:/app/console-data
      - ./logs/web-console:/app/logs
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  worker:
    image: enterprise-ai-platform-console-worker:day3
    build:
      context: .
      dockerfile: docker/Dockerfile.console-worker
    environment:
      WEB_CONSOLE_DATA_DIR: /app/console-data
      WEB_CONSOLE_QUEUE_LIMIT: "32"
      WEB_CONSOLE_TIMEOUT_SECONDS: "10"
      WEB_CONSOLE_AGENT_TIMEOUT_SECONDS: "60"
    volumes:
      - ./data/web-console/queue:/app/console-data
      - ./data/web-console/proofs:/app/data
    # Fixture tasks and local stdio MCP need no network.
    network_mode: none
    init: true
    stop_grace_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  frontend:
    image: enterprise-ai-platform-console-frontend:day3
    build: ./frontend
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      api: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
