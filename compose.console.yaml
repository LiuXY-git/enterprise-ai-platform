# Standalone opt-in stack. Does not replace the existing knowledge-hub deployment.
name: enterprise-console
services:
  api:
    image: enterprise-ai-platform-console-api:web-v1
    build:
      context: .
      dockerfile: docker/Dockerfile.console-api
    command: ["uvicorn", "backend.app.console.application:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      WEB_CONSOLE_DATA_DIR: /app/console-data
      WEB_CONSOLE_QUEUE_LIMIT: "32"
      WEB_CONSOLE_TIMEOUT_SECONDS: "10"
      WEB_CONSOLE_AGENT_TIMEOUT_SECONDS: "60"
      WEB_CONSOLE_N8N_BASE_URL: ${WEB_CONSOLE_N8N_BASE_URL:-}
      WEB_CONSOLE_EVALUATION_TIMEOUT_SECONDS: "900"
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - ${WEB_CONSOLE_STORAGE_ROOT:-./data/web-console}/api:/app/data
      - ${WEB_CONSOLE_STORAGE_ROOT:-./data/web-console}/chroma-cache:/home/app/.cache/chroma
      - ${WEB_CONSOLE_STORAGE_ROOT:-./data/web-console}/queue:/app/console-data
      - ${WEB_CONSOLE_LOG_ROOT:-./logs/web-console}:/app/logs
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  worker:
    image: enterprise-ai-platform-console-worker:web-v1
    build:
      context: .
      dockerfile: docker/Dockerfile.console-worker
    environment:
      WEB_CONSOLE_DATA_DIR: /app/console-data
      WEB_CONSOLE_EVALUATION_DATA_DIR: /app/evaluation-data
      WEB_CONSOLE_QUEUE_LIMIT: "32"
      WEB_CONSOLE_TIMEOUT_SECONDS: "10"
      WEB_CONSOLE_AGENT_TIMEOUT_SECONDS: "60"
      WEB_CONSOLE_N8N_BASE_URL: ${WEB_CONSOLE_N8N_BASE_URL:-}
      WEB_CONSOLE_EVALUATION_TIMEOUT_SECONDS: "900"
    volumes:
      - evaluation-data:/app/evaluation-data
      - ${WEB_CONSOLE_STORAGE_ROOT:-./data/web-console}/queue:/app/console-data
      - ${WEB_CONSOLE_STORAGE_ROOT:-./data/web-console}/proofs:/app/data
    # Only configured workflow subprocesses receive the n8n address. Fixture children receive no model keys.
    extra_hosts: ["host.docker.internal:host-gateway"]
    init: true
    stop_grace_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  frontend:
    image: enterprise-ai-platform-console-frontend:web-v1
    build: ./frontend
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      api: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  evaluation-data:
