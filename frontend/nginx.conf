worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Log paths, never request bodies or query strings.
    log_format platform '$remote_addr $request_method $uri $status';
    access_log /dev/stdout platform;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server_tokens off;

    # Re-resolve the service after Compose recreates the API container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream platform_api {
        zone platform_api 64k;
        server api:8000 resolve;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;
        client_max_body_size 10m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok\n';
        }
        location /api/ {
            proxy_pass http://platform_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 180s;
            # Uploads must not be retried automatically after partial processing.
            proxy_next_upstream off;
        }
        location / {
            expires -1;
            try_files $uri $uri/ =404;
        }
    }
}
