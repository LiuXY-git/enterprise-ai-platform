<text x="738" y="1002" font-size="19" fill="#7551a2" font-weight="400">审批提案</text>
<text x="1040" y="1018" font-size="21" fill="#52677f" font-weight="400">Planning / Memory 保留独立实验入口。</text>
<text x="1040" y="1054" font-size="21" fill="#52677f" font-weight="400">本区无 Agent HTTP API 或网页入口。</text>
<text x="1040" y="1090" font-size="21" fill="#52677f" font-weight="400">任务日志回放 ≠ 自动恢复执行。</text>
<text x="72" y="1160" font-size="21" fill="#52677f" font-weight="400">CLI 与 Compose 是不同运行入口；评测通过率只对应固定用例，不能代表生产或真实模型质量。</text>
<text x="48" y="1220" font-size="20" fill="#52677f" font-weight="400">阅读方式：先看入口，再看调用路径，最后看存储与边界。逐项代码映射见 docs/week-15.md#day100-code。</text>
