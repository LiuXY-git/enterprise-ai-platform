<title id="title">Enterprise AI Platform · 系统架构</title><desc id="desc">上半部分为三个 Docker Compose 服务：前端、API 和 n8n。SQLite 和 Chroma 嵌入 API；生成模型与 Dify 在 Compose 外。下半部分为宿主机固定场景评测、销售 Agent、本地 MCP 与人工审批，未接入网页。</desc>
