services:
  api:
    image: enterprise-ai-platform:1.0.0
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: enterprise-ai-platform-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./data/chroma-cache:/home/app/.cache/chroma
    init: true
    restart: unless-stopped
    stop_grace_period: 10s