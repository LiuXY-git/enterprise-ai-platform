services:
  api:
    image: enterprise-ai-platform:1.0.0
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: enterprise-ai-platform-api
    environment:
      LLM_PROVIDER: "${LLM_PROVIDER:-deepseek}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-v4-flash}"
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
      QWEN_BASE_URL: "${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
      QWEN_MODEL: "${QWEN_MODEL:-qwen3.7-plus}"
      DIFY_EXTERNAL_KNOWLEDGE_API_KEY: "${DIFY_EXTERNAL_KNOWLEDGE_API_KEY:-}"
      DIFY_EXTERNAL_KNOWLEDGE_ID: "${DIFY_EXTERNAL_KNOWLEDGE_ID:-enterprise-knowledge-hub}"
      DIFY_API_BASE_URL: "${DIFY_API_BASE_URL:-http://host.docker.internal/v1}"
      DIFY_WORKFLOW_API_KEY: "${DIFY_WORKFLOW_API_KEY:-}"
      DIFY_WORKFLOW_TIMEOUT_SECONDS: "${DIFY_WORKFLOW_TIMEOUT_SECONDS:-120}"
      FEISHU_APP_ID: "${FEISHU_APP_ID:-}"
      FEISHU_APP_SECRET: "${FEISHU_APP_SECRET:-}"
      FEISHU_API_BASE_URL: "${FEISHU_API_BASE_URL:-https://open.feishu.cn/open-apis}"
      FEISHU_TIMEOUT_SECONDS: "${FEISHU_TIMEOUT_SECONDS:-10}"
      FEISHU_RECEIVE_ID_TYPE: "${FEISHU_RECEIVE_ID_TYPE:-chat_id}"
      FEISHU_RECEIVE_ID: "${FEISHU_RECEIVE_ID:-}"
      FEISHU_MAX_ATTEMPTS: "${FEISHU_MAX_ATTEMPTS:-3}"
      FEISHU_RETRY_BASE_SECONDS: "${FEISHU_RETRY_BASE_SECONDS:-0.5}"
      WECOM_CORP_ID: "${WECOM_CORP_ID:-}"
      WECOM_AGENT_ID: "${WECOM_AGENT_ID:-}"
      WECOM_APP_SECRET: "${WECOM_APP_SECRET:-}"
      WECOM_TO_USER: "${WECOM_TO_USER:-}"
      WECOM_API_BASE_URL: "${WECOM_API_BASE_URL:-https://qyapi.weixin.qq.com}"
      WECOM_TIMEOUT_SECONDS: "${WECOM_TIMEOUT_SECONDS:-10}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./data/chroma-cache:/home/app/.cache/chroma
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.36.8
    container_name: enterprise-ai-platform-n8n
    environment:
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}"
      N8N_HOST: "${N8N_HOST:-localhost}"
      N8N_PORT: "${N8N_PORT:-5678}"
      N8N_PROTOCOL: "${N8N_PROTOCOL:-http}"
      N8N_EDITOR_BASE_URL: "${N8N_EDITOR_BASE_URL:-http://localhost:5678/}"
      N8N_WEBHOOK_URL: "${N8N_WEBHOOK_URL:-http://localhost:5678/}"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS:-true}"
      GENERIC_TIMEZONE: "${GENERIC_TIMEZONE:-Asia/Shanghai}"
      TZ: "${TZ:-Asia/Shanghai}"
      EXECUTIONS_DATA_PRUNE: "${EXECUTIONS_DATA_PRUNE:-true}"
      EXECUTIONS_DATA_MAX_AGE: "${EXECUTIONS_DATA_MAX_AGE:-168}"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://127.0.0.1:5678/healthz/readiness || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  n8n_data:
